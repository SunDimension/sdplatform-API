models:

  User:
    id: uuid primary
    role_id: uuid foreign:roles
    agency_id: uuid foreign:agencies nullable
    firstname: string
    lastname: string
    password: string
    profile_picture: string nullable
    date_of_birth: date nullable
    gender: string nullable
    email: string unique
    phone: string nullable
    status: string
    email_verified: boolean default:false
    phone_verified: boolean default:false
    kyc_verified: boolean default:false
    last_login: timestamp nullable
    remember_token: string nullable
    timestamps: {}

  Agency:
    id: uuid primary
    company_name: string
    registeration_number: string
    address: string
    phone: string
    email: string
    status: string
    website: string nullable
    license_number: string nullable
    logo: string nullable
    description: text nullable
    subscription_id: uuid foreign:subscriptions nullable
    timestamps: {}

  Property:
    id: uuid primary
    agency_id: uuid foreign:agencies nullable
    owner_id: uuid foreign:users
    agent_id: uuid foreign:users nullable
    property_type_id: uuid foreign:property_types
    category_id: uuid foreign:property_categories
    status_id: uuid foreign:property_statuses
    purpose: string
    description: text
    price: float
    title: string
    currency: string
    negotiable: boolean default:false
    bedrooms: integer nullable
    bathrooms: integer nullable
    toilets: integer nullable
    parking_spaces: integer nullable
    kitchen: integer nullable
    living_rooms: integer nullable
    land_size: float nullable
    building_size: float nullable
    year_built: integer nullable
    floors: integer nullable
    furnished: boolean default:false
    serviced: boolean default:false
    pet_friendly: boolean default:false
    minimum_rent_period: string nullable
    available_from: date nullable
    longitude: float nullable
    latitude: float nullable
    country_id: uuid foreign:countries
    state_id: uuid foreign:states
    city_id: uuid foreign:cities
    area_id: uuid foreign:areas nullable
    street_address: string nullable
    postal_code: string nullable
    featured: boolean default:false
    premium: boolean default:false
    verified: boolean default:false
    views: integer default:0
    likes: integer default:0
    published_at: timestamp nullable
    expiry_date: timestamp nullable
    timestamps: {}

  Role:
    id: uuid primary
    name: string
    timestamps: {}

  Permission:
    id: uuid primary
    name: string
    timestamps: {}

  PermissionRole:
    id: uuid primary
    permission_id: uuid foreign:permissions
    role_id: uuid foreign:roles
    timestamps: {}

  PropertyType:
    id: uuid primary
    name: string
    timestamps: {}

  PropertyCategory:
    id: uuid primary
    name: string
    timestamps: {}

  PropertyStatus:
    id: uuid primary
    name: string
    timestamps: {}

  PropertyImage:
    id: uuid primary
    property_id: uuid foreign:properties
    image_url: string
    is_cover: boolean default:false
    timestamps: {}

  PropertyVideo:
    id: uuid primary
    property_id: uuid foreign:properties
    video_url: string
    thumbnail: string nullable
    timestamps: {}

  PropertyDocument:
    id: uuid primary
    property_id: uuid foreign:properties
    survey_plan_url: string nullable
    title: string
    CofO: string nullable
    floor_plan: string nullable
    approval_letter: string nullable
    document_type: string
    verified: boolean default:false
    document_url: string
    timestamps: {}

  Feature:
    id: uuid primary
    name: string
    timestamps: {}

  PropertyFeature:
    id: uuid primary
    property_id: uuid foreign:properties
    feature_id: uuid foreign:features
    timestamps: {}

  Amenity:
    id: uuid primary
    name: string
    timestamps: {}

  PropertyAmenity:
    id: uuid primary
    property_id: uuid foreign:properties
    amenity_id: uuid foreign:amenities
    timestamps: {}

  Country:
    id: uuid primary
    name: string
    code: string
    timestamps: {}

  State:
    id: uuid primary
    country_id: uuid foreign:countries
    name: string
    timestamps: {}

  City:
    id: uuid primary
    state_id: uuid foreign:states
    name: string
    timestamps: {}

  Area:
    id: uuid primary
    city_id: uuid foreign:cities
    name: string
    timestamps: {}

  PropertyEnquiry:
    id: uuid primary
    property_id: uuid foreign:properties
    sender_id: uuid foreign:users
    receiver_id: uuid foreign:users
    message: text
    status: string
    email: string nullable
    phone: string nullable
    timestamps: {}

  PropertyView:
    id: uuid primary
    property_id: uuid foreign:properties
    user_id: uuid foreign:users nullable
    ip_address: string nullable
    device: string nullable
    browser: string nullable
    country: string nullable
    viewed_at: timestamp
    timestamps: {}

  SavedProperty:
    id: uuid primary
    property_id: uuid foreign:properties
    user_id: uuid foreign:users
    timestamps: {}

  PropertyOffer:
    id: uuid primary
    property_id: uuid foreign:properties
    buyer_id: uuid foreign:users
    offer_amount: float
    status: string
    message: text nullable
    accepted_at: timestamp nullable
    rejected_at: timestamp nullable
    timestamps: {}

  InspectionBooking:
    id: uuid primary
    property_id: uuid foreign:properties
    user_id: uuid foreign:users
    scheduled_at: timestamp
    schedule_time: string
    remarks: text nullable
    status: string
    timestamps: {}

  Conversation:
    id: uuid primary
    property_id: uuid foreign:properties nullable
    buyer_id: uuid foreign:users
    seller_id: uuid foreign:users
    timestamps: {}

  Message:
    id: uuid primary
    conversation_id: uuid foreign:conversations
    sender_id: uuid foreign:users
    message: text
    attachments: string nullable
    read_at: timestamp nullable
    timestamps: {}

  SubscriptionPlan:
    id: uuid primary
    name: string
    price: float
    duration: integer
    listing_limit: integer
    featured_limit: integer
    priority_support: boolean default:false
    timestamps: {}

  Subscription:
    id: uuid primary
    user_id: uuid foreign:users
    subscription_plan_id: uuid foreign:subscription_plans
    start_date: date
    end_date: date
    payment_id: uuid foreign:payments nullable
    timestamps: {}

  Payment:
    id: uuid primary
    user_id: uuid foreign:users
    subscription_id: uuid foreign:subscriptions nullable
    property_id: uuid foreign:properties nullable
    currency: string
    gateway: string
    transaction_reference: string
    paid_at: timestamp nullable
    amount: float
    payment_status: string
    timestamps: {}

  Review:
    id: uuid primary
    property_id: uuid foreign:properties
    reviewer_id: uuid foreign:users
    rating: integer
    comment: text nullable
    timestamps: {}

  Notification:
    id: uuid primary
    user_id: uuid foreign:users
    title: string
    message: text
    notification_type: string
    read_at: timestamp nullable
    timestamps: {}

  AdPackage:
    id: uuid primary
    name: string
    price: float
    duration: integer
    homepage: boolean default:false
    category_page: boolean default:false
    search_page: boolean default:false
    timestamps: {}

  Advertisement:
    id: uuid primary
    user_id: uuid foreign:users
    ad_package_id: uuid foreign:ad_packages
    property_id: uuid foreign:properties
    start_date: date
    end_date: date
    status: string
    timestamps: {}

  BlogPost:
    id: uuid primary
    title: string
    slug: string unique
    content: text
    status: string
    featured_image: string nullable
    author_id: uuid foreign:users
    published_at: timestamp nullable
    timestamps: {}

  Page:
    id: uuid primary
    title: string
    slug: string unique
    content: text
    status: string
    timestamps: {}

  FAQ:
    id: uuid primary
    question: string
    answer: text
    status: string
    timestamps: {}

  Setting:
    id: uuid primary
    key: string unique
    value: text nullable
    timestamps: {}

  AuditLog:
    id: uuid primary
    user_id: uuid foreign:users nullable
    action: string
    model: string
    model_id: uuid nullable
    changes: text nullable
    old_values: text nullable
    new_values: text nullable
    ip_address: string nullable
    user_agent: string nullable
    timestamps: {}

  ReportedListing:
    id: uuid primary
    property_id: uuid foreign:properties
    reporter_id: uuid foreign:users
    reason: text
    description: text nullable
    resolved_by: uuid foreign:users nullable
    resolved_at: timestamp nullable
    status: string
    timestamps: {}

  MortgageCalculation:
    id: uuid primary
    user_id: uuid foreign:users nullable
    property_id: uuid foreign:properties nullable
    loan_amount: float
    interest_rate: float
    loan_term: integer
    monthly_payment: float
    total_payment: float
    timestamps: {}

